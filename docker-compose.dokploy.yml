# QM on the taincap Dokploy box.
#
# Topology notes (do not "simplify" these away):
# - dind is the Docker daemon that hosts agent sandboxes. It is privileged.
#   Its API binds to loopback only, so nothing outside this stack can reach it.
# - core runs with network_mode: service:dind. The local sandbox backend
#   publishes agent ports on the daemon host's loopback and dials
#   http://127.0.0.1:<port>; sharing the network namespace is what makes
#   that work. The "core" DNS name is a network alias on the dind service.
# - portal is the only service with a public domain. It must be on both
#   the default network and dokploy-network (Traefik).
# - Every ${VAR} must exist in the Dokploy Environment tab; unmapped vars
#   vanish silently.

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qm
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    # Full command override: the entrypoint adds --host=tcp://0.0.0.0:2375
    # when only flags are passed. Spelling out dockerd keeps the API on
    # loopback and the unix socket (used by the healthcheck).
    command:
      [
        "dockerd",
        "--host=unix:///var/run/docker.sock",
        "--host=tcp://127.0.0.1:2375",
        "--tls=false",
      ]
    volumes:
      - dind-data:/var/lib/docker
      # The deploy provider runs `docker run -v <snapshotDir>:/app:ro` against
      # THIS daemon, and a daemon resolves bind sources on its own filesystem.
      # snapshotDir lives under core's /data, so dind must see the same volume
      # at the same path or docker silently mounts an empty dir and the app
      # exits instantly (core then answers 502 "deployment unreachable").
      # Read-only: app snapshots are mounted :ro anyway.
      - coredata:/data:ro
    networks:
      default:
        aliases: [core]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "version"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

# compose-readLogs is broken on this Dokploy box. buildlog's healthcheck
  # tails the builder's log file, and docker-getConfig exposes the last
  # healthcheck outputs in State.Health.Log — a readable log channel.
  buildlog:
    image: alpine:3.21
    command: ["sh", "-c", "touch /log/build.log && sleep infinity"]
    volumes:
      - buildlog:/log
    healthcheck:
      test: ["CMD-SHELL", "echo '-- tail of build.log --'; tail -c 3000 /log/build.log"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  sandbox-image:
    image: docker:27-cli
    network_mode: service:dind
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      REVISION: ${SANDBOX_IMAGE_REVISION:-1}
    volumes:
      - ./:/repo:ro
      - buildlog:/log
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/bin/sh /repo/deploy-dokploy/build-sandbox-image.sh >/log/build.log 2>&1",
      ]
    depends_on:
      dind:
        condition: service_healthy
    restart: "no"

  # Agent sandboxes (containers inside dind) cannot resolve dokploy-network
  # names: their DNS and routing end at dind's netns, and dind is only on
  # this project's default network. But every sandbox is created with
  # --add-host=host.docker.internal:host-gateway (src/sandbox/local-sandbox.ts),
  # which points into dind's netns. So a listener in dind's netns is the one
  # doorway sandboxes can always reach without DNS.
  #
  # gatus-bridge listens there and forwards to gatus-relay, which sits on
  # both networks and forwards to the Gatus container on dokploy-network.
  # Sandboxes read Gatus as:  http://host.docker.internal:18080/api/v1/endpoints/statuses
  #
  # Two hops on purpose: attaching dind itself to dokploy-network would give
  # every sandbox IP-level reach to EVERY container on the shared network.
  # This exposes exactly one read-only upstream and nothing else.
  gatus-relay:
    image: alpine/socat:latest
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:compose-index-mobile-system-i1cg91-gatus-1:8080"]
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  gatus-bridge:
    image: alpine/socat:latest
    network_mode: service:dind
    command: ["TCP-LISTEN:18080,fork,reuseaddr", "TCP:gatus-relay:8080"]
    depends_on:
      dind:
        condition: service_healthy
      gatus-relay:
        condition: service_started
    restart: unless-stopped

  # Transient diagnostic probe: inspects agent-deploy containers inside dind
  # and writes findings to /log/probe.log. Read via this service's healthcheck
  # output (docker-getConfig State.Health.Log), same channel as buildlog.
  # Bump PROBE_REVISION to re-run. Remove after the deploy 502s are fixed.
  deploy-probe:
    image: docker:27-cli
    network_mode: service:dind
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      PROBE_REVISION: "3"
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/bin/sh /repo/deploy-dokploy/deploy-probe.sh >/log/probe.log 2>&1; sleep infinity",
      ]
    volumes:
      - ./:/repo:ro
      - buildlog:/log
    healthcheck:
      test: ["CMD-SHELL", "echo '-- tail of probe.log --'; tail -c 3800 /log/probe.log"]
      interval: 15s
      timeout: 10s
      retries: 3
    depends_on:
      dind:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: .
      dockerfile: deploy-dokploy/core-dind.Dockerfile
    network_mode: service:dind
    environment:
      PORT: "8080"
      DATA_DIR: /data
      SESSION_STORE: postgres
      RUN_STORE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@pg:5432/qm
      ORG_ID: anduin
      PUBLIC_WEB_URL: https://qm-cl.anduincapital.dev
      WEB_UI_PUBLIC_URL: https://qm-cl.anduincapital.dev
      HARNESS: claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_IMAGE: qm-sandbox-local:latest
      LOCAL_SANDBOX_CPUS: "1"
      LOCAL_SANDBOX_MEMORY_MB: "2048"
      DOCKER_HOST: tcp://127.0.0.1:2375
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      CAPABILITY_SECRET: ${CAPABILITY_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY}
      SKILL_SIGNING_SECRET: ${SKILL_SIGNING_SECRET}
      ADMIN_GRANTS: ${ADMIN_GRANTS}
    volumes:
      - coredata:/data
    depends_on:
      pg:
        condition: service_healthy
      dind:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  web-ui:
    build:
      context: .
      dockerfile: deploy/web-ui/Dockerfile
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: anduin
      WEB_UI_PUBLIC_URL: https://qm-cl.anduincapital.dev
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    depends_on:
      - dind
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/admin/Dockerfile
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: anduin
      ADMIN_BASE_PATH: /admin
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    depends_on:
      - dind
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: deploy/auth/Dockerfile
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: anduin
      AUTH_ISSUER: https://qm-cl.anduincapital.dev/idp
      AUTH_CLIENT_ID: qm-portal
      AUTH_REDIRECT_URI: https://qm-cl.anduincapital.dev/auth/callback
      AUTH_ALLOWED_EMAIL_DOMAIN: anduintransact.com
      AUTH_EMAIL_TRANSPORT: ${AUTH_EMAIL_TRANSPORT:-resend}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      AUTH_SIGNING_JWK: ${AUTH_SIGNING_JWK}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
    # portal only accepts broker URLs on hosts it considers private
    # (.internal/.flycast/.local/localhost); a bare compose service name
    # fails its boot check, hence the alias.
    networks:
      default:
        aliases: [auth.internal]
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: deploy/portal/Dockerfile
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: anduin
      PORTAL_PUBLIC_URL: https://qm-cl.anduincapital.dev
      WEB_UI_UPSTREAM: http://web-ui:8080
      ADMIN_UPSTREAM: http://admin:8080
      AUTH_BROKER_UPSTREAM: http://auth.internal:8080
      AUTH_BROKER_PREFIX: /idp
      OIDC_CLIENT_ID: qm-portal
      OIDC_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      OIDC_ISSUER: https://qm-cl.anduincapital.dev/idp
      OIDC_AUTH_ENDPOINT: https://qm-cl.anduincapital.dev/idp/authorize
      OIDC_TOKEN_ENDPOINT: http://auth.internal:8080/token
      OIDC_USERINFO_ENDPOINT: http://auth.internal:8080/userinfo
      OIDC_JWKS_URI: http://auth.internal:8080/.well-known/jwks.json
      OIDC_SCOPES: openid email
      OIDC_PRINCIPAL_CLAIM: email
      OIDC_ALLOWED_EMAIL_DOMAIN: anduintransact.com
      # Serve agent-published apps at /d/<name>/. Without this the portal
      # answers {"error":"not_found"} for the whole /d/ family (index.ts:998).
      # Safe only because PORTAL_PLAYGROUND is unset: anonymous visitors must
      # never reach deployed apps.
      PORTAL_DEPLOYMENTS_ENABLED: "1"
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    networks:
      - default
      - dokploy-network
    depends_on:
      - dind
      - web-ui
      - auth
    restart: unless-stopped

volumes:
  pgdata:
  coredata:
  dind-data:
  buildlog:

networks:
  default:
  dokploy-network:
    external: true
